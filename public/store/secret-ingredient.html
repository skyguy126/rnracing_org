}
.sheet-wrap {
  position: relative;
  max-width: 680px;
  margin: 0 auto;
  filter: drop-shadow(0 16px 28px rgba(0,0,0,.55));
}
.sheet {
  position: relative;
  padding: clamp(36px, 7vw, 64px) clamp(24px, 7vw, 64px) clamp(40px, 7vw, 64px);
}
.paper {
  position: absolute; inset: 0;
  background:
    radial-gradient(ellipse at 50% 50%, transparent 55%, rgba(120,75,25,.35) 100%),
    linear-gradient(160deg, var(--vellum), var(--vellum-edge));
  filter: url(#ragged);
}
.text { position: relative; max-width: 52ch; margin: 0 auto; font-size: 1.02rem; line-height: 1.65; }


h1 {
  font-family: var(--display);
  font-weight: 400;
  text-align: center;
  font-size: clamp(2.2rem, 7vw, 3.3rem);
  line-height: 1.1;
  margin: 0;
  text-wrap: balance;
}
.meta {
  text-align: center;
  font-style: italic;
  color: var(--ink-soft);
  margin: 14px 0 0;
}
h2 {
  font-family: var(--body);
  font-weight: 400;
  font-size: .9rem;
  text-transform: uppercase;
  letter-spacing: .2em;
  color: var(--rubric);
  text-align: center;
  margin: 36px 0 12px;
}
ul, ol { margin: 0; padding: 0; list-style: none; }
ul li { display: flex; gap: 14px; padding: 4px 0; border-bottom: 1px solid rgba(106,80,56,.25); }
ul .q { color: var(--rubric); min-width: 4.8em; flex-shrink: 0; }
ul li.secret .q, ul li.secret span:last-child { color: var(--rubric); font-style: italic; }
ul li.secret em { color: var(--ink-soft); }
ol { counter-reset: m; display: grid; gap: .8em; }
ol li { counter-increment: m; position: relative; padding-left: 2.4em; }
ol li::before {
  content: counter(m, upper-roman) ".";
  position: absolute; left: 0;
  color: var(--rubric);
}
.note { margin: 30px 0 0; font-size: .95rem; color: var(--ink-soft); font-style: italic; text-align: center; }


body { min-height: 100vh; box-sizing: border-box; display: grid; align-content: center; }
.reveal { text-align: center; padding-block: 32px; }
.reveal > * { text-align: center; }
.reveal .eyebrow { text-transform: uppercase; letter-spacing: .2em; font-size: .8rem; color: var(--rubric); margin: 0 auto; font-style: normal; }
.reveal .word { font-family: var(--display); font-size: clamp(4.5rem, 18vw, 8rem); line-height: 1; margin: 18px 0; }
.reveal p { margin: 0 auto; max-width: 34ch; font-style: italic; color: var(--ink-soft); }
</style>
</head>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">

    <feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="3" seed="7" result="n"/>
    <feDisplacementMap in="SourceGraphic" in2="n" scale="10" xChannelSelector="R" yChannelSelector="G"/>
  </filter>
</svg>

<div class="sheet-wrap">
  <article class="sheet">
    <div class="paper" aria-hidden="true"></div>
    <div class="text reveal">
      <p class="eyebrow">The Secret Ingredient</p>
      <p class="word">Love</p>
      <p>Add it at every step of the Ninja Banana Bread. There is no such thing as too much.</p>
    </div>
  </article>
</div>
</body>
