<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <filter id="noise" x="-20%" y="-20%" width="140%" height="140%">
    <feTurbulence type="fractalNoise" baseFrequency="0.78" numOctaves="4" seed="711" stitchTiles="stitch"/>
    <feColorMatrix type="saturate" values="0"/>
    <feComponentTransfer>
      <feFuncR type="linear" slope=".18" intercept=".42"/>
      <feFuncG type="linear" slope=".18" intercept=".42"/>
      <feFuncB type="linear" slope=".18" intercept=".42"/>
      <feFuncA type="table" tableValues="0 .13"/>
    </feComponentTransfer>
  </filter>
  <rect width="512" height="512" fill="#fff" filter="url(#noise)" opacity=".5"/>
</svg>
