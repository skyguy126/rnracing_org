<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1100">
  <defs>
    <linearGradient id="cover" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#111114"/>
      <stop offset="0.52" stop-color="#09090b"/>
      <stop offset="1" stop-color="#111114"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#60a5fa" stop-opacity=".9"/>
      <stop offset=".5" stop-color="#3b82f6" stop-opacity=".35"/>
      <stop offset="1" stop-color="#60a5fa" stop-opacity=".8"/>
    </linearGradient>
    <pattern id="micro" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <path d="M0 0H18" stroke="#fafafa" stroke-opacity=".025" stroke-width="1"/>
    </pattern>
    <filter id="inner" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="b"/>
      <feComposite in="b" in2="SourceGraphic" operator="out" result="o"/>
      <feFlood flood-color="#000" flood-opacity=".8" result="c"/>
      <feComposite in="c" in2="o" operator="in" result="s"/>
      <feComposite in="s" in2="SourceGraphic" operator="over"/>
    </filter>
  </defs>
  <rect width="1600" height="1100" rx="56" fill="url(#cover)"/>
  <rect x="22" y="22" width="1556" height="1056" rx="42" fill="url(#micro)" stroke="url(#edge)" stroke-width="4" filter="url(#inner)"/>
  <rect x="56" y="56" width="1488" height="988" rx="30" fill="none" stroke="#fafafa" stroke-opacity=".07" stroke-width="2"/>
  <path d="M92 952 344 700h72L164 952H92Zm1094-804h72l250 250v72l-322-322Z" fill="#3b82f6" opacity=".7"/>
